[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osintkit"
version = "0.1.0"
description = "A uniform async interface over free and keyed OSINT data sources."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Darius Genkinger" }]
keywords = ["osint", "intelligence", "recon", "enrichment", "threat-intelligence"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Framework :: AsyncIO",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
]
dependencies = [
    "httpx>=0.24",
    "beautifulsoup4>=4.11",
]

[project.urls]
Homepage = "https://github.com/BalalaikaDev/osintkit"
Source = "https://github.com/BalalaikaDev/osintkit"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["osintkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
